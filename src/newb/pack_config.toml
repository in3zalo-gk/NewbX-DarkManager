name = "Newb X Dark Manager"
version = [0, 1, 0]
min_supported_mc_version = [1, 26, 50]
description = '''
§c%w
§7- Dark fantasy shader: deep fog, cold nights, warm torchlight.
%v
§3Based on Newb Shader by devendrn
''' # %w = patch warning, %v = version
authors = ["Marcos", "devendrn"]
url = "https://github.com/devendrn/newb-x-mcbe"
uuid = "a67d8c81-80c0-445a-9b53-470458fb8d27" # Use https://www.uuidgenerator.net/version4
materials = ["Actor", "ActorGlint", "ActorMultiTexture", "Clouds", "EndSky", "ItemInHandColor", "ItemInHandColorGlint", "ItemInHandTextured", "RenderChunk","Sky", "Stars", "SunMoon", "Weather"]

