# subpacks are arranged in left to right order
# right-most subpack is enabled by default
[[subpack]]
define = "REALISTIC_CLOUDS"
materials = ["Clouds", "RenderChunk"]
description = '''
§lNuvens Realistas / Realistic Clouds
§r§7PT: Ativa nuvens 3D volumétricas realistas com profundidade e volume. Mais pesado no FPS, ideal para dispositivos intermediários/altos que querem céu cinematográfico.
§7EN: Enables realistic volumetric 3D clouds with depth and volume. Heavier on FPS, ideal for mid/high devices wanting a cinematic sky.
§cNecessário MBLoader ou Minecraft Patched.
'''

[[subpack]]
define = "ROUNDED_CLOUDS"
materials = ["Clouds"]
description = '''
§lNuvens Arredondadas / Rounded Clouds
§r§7PT: Nuvens 3D macias e arredondadas, visual suave com custo médio de desempenho. Bom equilíbrio entre beleza e FPS.
§7EN: Soft rounded 3D clouds, smooth look with medium performance cost. Good balance between beauty and FPS.
§cNecessário MBLoader ou Minecraft Patched.
'''

[[subpack]]
define = "BOX_CLOUDS"
materials = ["Clouds", "RenderChunk"]
description = '''
§lNuvens em Caixa / Box Clouds
§r§7PT: Nuvens de blocos estilo vanilla clássico. Leve, fiel ao Minecraft original, ótimo para maximizar FPS.
§7EN: Classic vanilla-style block clouds. Lightweight, true to original Minecraft, great for maximizing FPS.
§cNecessário MBLoader ou Minecraft Patched.
'''

[[subpack]]
define = "CHUNK_ANIM"
materials = ["RenderChunk"]
description = '''
§lAnimação de Chunks / Chunk Animation
§r§7PT: Os blocos sobem e se formam suavemente ao carregar o terreno. Efeito visual de “mundo nascendo”, leve no desempenho.
§7EN: Blocks rise and form smoothly when terrain loads. “World birth” visual effect, light on performance.
§cNecessário MBLoader ou Minecraft Patched.
'''

[[subpack]]
define = "NO_WAVE_NO_FOG"
materials = ["RenderChunk"]
description = '''
§lSem Fog e Sem Ondas / No Fog & No Waves
§r§7PT: Remove completamente a névoa do terreno e todas as animações de plantas, folhas, lanternas e água. Máximo FPS, visual mais “seco”.
§7EN: Completely removes terrain fog and all plant/leaf/lantern/water animations. Maximum FPS, drier look.
§cNecessário MBLoader ou Minecraft Patched.
'''

[[subpack]]
define = "NO_FOG"
materials = ["RenderChunk"]
description = '''
§lSem Fog / No Fog
§r§7PT: Remove apenas a névoa do terreno (mantém ondas e animações). Útil se a fog estiver atrapalhando a visão ou o FPS.
§7EN: Removes only terrain fog (keeps waves and animations). Useful if fog is hurting visibility or FPS.
§cNecessário MBLoader ou Minecraft Patched.
'''

[[subpack]]
define = "NO_WAVE"
materials = ["RenderChunk"]
description = '''
§lSem Ondas / No Waves
§r§7PT: Plantas, folhas, lanternas e água ficam completamente paradas. Mantém fog e restante dos efeitos. Bom para quem prefere visual estático.
§7EN: Plants, leaves, lanterns and water stay completely still. Keeps fog and other effects. Good for those who prefer a static look.
§cNecessário MBLoader ou Minecraft Patched.
'''

[[subpack]]
define = "DARK_LOW"
materials = ["Actor", "ActorGlint", "ActorMultiTexture", "Clouds", "EndSky", "ItemInHandColor", "ItemInHandColorGlint", "ItemInHandTextured", "RenderChunk", "Sky", "Stars", "SunMoon", "Weather"]
description = '''
§lDark Fantasy — Low
§r§7PT: Modo leve. Desativa bloom, raios de sol, luz entre folhas, ondas, aurora e brilho de chuva. Mantém fog por bioma, céu, Nether, End e iluminação principal. Ideal para dispositivos de entrada (ex: Moto G24) e mais FPS.
§7EN: Light mode. Disables bloom, sun rays, leaf light, waves, aurora and rain shimmer. Keeps biome fog, sky, Nether, End and main lighting. Ideal for entry-level devices (e.g. Moto G24) and higher FPS.
§cNecessário MBLoader ou Minecraft Patched.
'''

