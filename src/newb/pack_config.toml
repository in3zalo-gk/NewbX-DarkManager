[[subpack]]
define = "DEFAULT"
materials = []
description = '''
§lDark Fantasy — Completo / Full (recomendado)
§r§7PT: Tudo ligado: fog forte personalizado por bioma, noites frias, chuva com poças reflexivas, luz do sol filtrando entre as folhas, aurora a cada 3 dias e bloom leve. Experiência completa Dark Fantasy.
§7EN: Everything on: strong biome-customized fog, cold nights, rain with reflective puddles, sunlight filtering through leaves, aurora every 3 days and light bloom. Full Dark Fantasy experience.
§cNecessário MBLoader ou Minecraft Patched.
'''
