name = "Newb X Dark Manager"
version = [0, 1, 0]
min_supported_mc_version = [1, 26, 50]
description = '''
§c%w
§7Dark Fantasy: fog forte por bioma, noites frias, chuva com poças, luz do sol entre as folhas e aurora a cada 3 dias.
§7Precisa de Minecraft 1.26.50+ com MB Loader (Android) ou MaterialBinLoader/Patched Minecraft. Não funciona sem loader.
§7Na engrenagem escolha o modo: Completo ou Low (mais FPS).
%v
§3Base: Newb Shader (devendrn)
''' # %w = patch warning, %v = version
authors = ["Marcos", "devendrn"]
url = "https://github.com/devendrn/newb-x-mcbe"
uuid = "a67d8c81-80c0-445a-9b53-470458fb8d27" # Use https://www.uuidgenerator.net/version4
materials = ["Actor", "ActorGlint", "ActorMultiTexture", "Clouds", "EndSky", "ItemInHandColor", "ItemInHandColorGlint", "ItemInHandTextured", "RenderChunk","Sky", "Stars", "SunMoon", "Weather"]

[info] 
copyright = '''
Copyright © 2026 %a, and "Newb Shader" Contributors

Newb X Dark Manager is a variant built from the source code of Newb X Legacy / Newb Shader (https://github.com/devendrn/newb-x-mcbe), which is licensed under the MIT License. This pack was compiled from that source. The original MIT license and copyright notice of Newb Shader apply to the shader source.

Official compiled "Newb Shader" packs by devendrn are licensed separately (CC BY-ND 4.0) and are not redistributed here.
''' # %a = authors
credits = '''
Newb X Dark Manager is a variant of Newb X Legacy / Newb Shader.
Original shader: devendrn and Newb Shader contributors (MIT) - https://github.com/devendrn/newb-x-mcbe
'''

# subpacks are arranged in left to right order
# right-most subpack is enabled by default
[[subpack]]
define = "REALISTIC_CLOUDS"
materials = ["Clouds", "RenderChunk"]
description = '''
Nuvens Realistas - nuvens 3D volumétricas (mais pesado)
'''

[[subpack]]
define = "ROUNDED_CLOUDS"
materials = ["Clouds"]
description = '''
Nuvens Arredondadas - nuvens 3D macias (custo médio)
'''

[[subpack]]
define = "BOX_CLOUDS"
materials = ["Clouds", "RenderChunk"]
description = '''
Nuvens em Caixa - nuvens de blocos estilo vanilla
'''

[[subpack]]
define = "CHUNK_ANIM"
materials = ["RenderChunk"]
description = '''
Animação de Chunks - os blocos sobem ao carregar
'''

[[subpack]]
define = "NO_WAVE_NO_FOG"
materials = ["RenderChunk"]
description = '''
Sem Fog e Sem Ondas - remove névoa e movimento de plantas/água (leve)
'''

[[subpack]]
define = "NO_FOG"
materials = ["RenderChunk"]
description = '''
Sem Fog - remove a névoa do terreno
'''

[[subpack]]
define = "NO_WAVE"
materials = ["RenderChunk"]
description = '''
Sem Ondas - plantas, folhas, lanternas e água paradas
'''

[[subpack]]
define = "DARK_LOW"
materials = ["Actor", "ActorGlint", "ActorMultiTexture", "Clouds", "EndSky", "ItemInHandColor", "ItemInHandColorGlint", "ItemInHandTextured", "RenderChunk", "Sky", "Stars", "SunMoon", "Weather"]
description = '''
Dark Fantasy — Low - sem bloom, raios, luz nas folhas, ondas, aurora e brilho de chuva; mantém fog, céu, Nether e End (mais FPS)
'''

